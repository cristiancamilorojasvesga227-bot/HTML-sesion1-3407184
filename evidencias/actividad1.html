<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - JHONES JHONSON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2c2c2e;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* El fondo morado exterior */
        .card-outer {
            background-color: #5841bc; 
            padding: 15px;
            border-radius: 20px;
            width: 320px;
        }

        /* El marco naranja */
        .card-inner {
            background-color: #ff9f43;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Contenedor de la foto */
        .card__header {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
        }

        /* Foto redondeada como pediste */
        .card__retrato {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%; /* Esto la hace redonda */
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        /* Caja de información gris oscuro */
        .card__info {
            background-color: #3d3d3d;
            padding: 30px 20px;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            margin-top: -20px; /* Sube para solapar el naranja */
            text-align: center;
            color: white;
        }

        .card__nombre {
            font-size: 16px;
            font-weight: bold;
            color: #f1f1f1;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .card__descripcion {
            font-size: 13px;
            line-height: 1.5;
            color: #d1d1d1;
            margin-bottom: 25px;
        }

        /* Botón Follow */
        .card__button {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 10px 35px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card-outer">
        <div class="card-inner">
            <div class="card__header">
                <img class="card__retrato" src="luffy.png" alt="Luffy">
            </div>

            <div class="card__info">
                <h2 class="card__nombre">Cristian Rojas</h2>
                <p class="card__descripcion">
                    Analisis y Desarrollo de Software
                    Ficha:3407184
                </p>
                <button class="card__button">Seguir</button>
            </div>
        </div>
    </div>

</body>
</html>
